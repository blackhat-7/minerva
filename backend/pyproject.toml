[project]
name = "minerva"
version = "0.1.0"
description = "Minerva backend: lesson generation, tutor, review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
minerva = "minerva.app:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
